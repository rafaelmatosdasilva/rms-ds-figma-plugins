# A design system release (a vX.Y.Z tag on this repository) reaches every product built on it.
#
# Each repository in products.json gets a `ds-release` dispatch with the version; its own ds-update workflow pins
# it, tests, builds and releases (or opens a pull request when its tests fail, or stops when nothing it ships
# changed). Needs PLUGINS_DISPATCH_TOKEN: a fine-grained token with Contents read and write on those repositories.
name: ds-release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Design system version to send, e.g. v1.0.1'
        required: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Send the version to every product
        env:
          GH_TOKEN: ${{ secrets.PLUGINS_DISPATCH_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No PLUGINS_DISPATCH_TOKEN yet: nothing sent. Add the secret, then run this workflow by hand with the version." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for repo in $(node -p 'require("./products.json").products.map((p) => p.repo).join(" ")'); do
            echo "→ $repo"
            gh api "repos/$repo/dispatches" -f event_type=ds-release -F "client_payload[version]=$VERSION"
            echo "- $repo: sent $VERSION" >> "$GITHUB_STEP_SUMMARY"
          done
