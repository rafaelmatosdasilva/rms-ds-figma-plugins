name: style guide

# Publishes the design system's living style guide on GitHub Pages, so anyone can see it without the Figma file.
# rms-design-system-engine builds it (--styleguide) from what is committed here: the theme, the shared UI, the Figma
# snapshots and the contracts. The products are checked out beside this repository, as the engine expects
# (ds-config.json, pluginDirs), and products.json gives the links to each one. The engine builds a local page and knows
# nothing about Pages; publishing is this workflow's job only. The page must pass the engine's style guide check
# (only the system's tokens and components on it, its own accessibility) or nothing is published.
#
# It republishes on its own: on a push here, and every hour when the engine, this repository or a product has a commit
# the published page was not built from. The page carries sources.txt (the commit of each one it was built from), and
# the hourly run compares it with the commits now, so nobody has to start a run by hand and an hour with no change
# builds nothing.

on:
  push:
    branches: [main]
    paths:
      - 'packages/ui/src/**'
      - 'ds-config.json'
      - 'contract.authored.json'
      - 'structure-contract.mjs'
      - 'design-system-engine-map.mjs'
      - 'bound-tokens.json'
      - 'component-state-tokens.json'
      - 'products.json'
      - '.github/workflows/style-guide.yml'
  schedule:
    - cron: '17 * * * *'   # hourly: builds only when the engine, this repository or a product changed since the page was built
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The commit of each source the page is built from, and whether the published page was built from them all.
  changed:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.compare.outputs.build }}
      engine: ${{ steps.compare.outputs.engine }}
      sources: ${{ steps.compare.outputs.sources }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: rms-ds-figma-plugins
          fetch-depth: 0   # every commit and release tag: each component's changelog, its version and Figma's reads
      - id: pages
        uses: actions/configure-pages@v5
      - id: compare
        run: |
          engine=$(git ls-remote https://github.com/rafaelmatosdasilva/rms-design-system-engine.git refs/heads/main | cut -f1)
          {
            echo "rafaelmatosdasilva/rms-ds-figma-plugins $GITHUB_SHA"
            echo "rafaelmatosdasilva/rms-design-system-engine $engine"
            for repo in $(node -p 'require("./rms-ds-figma-plugins/products.json").products.map((p) => p.repo).join(" ")'); do
              echo "$repo $(git ls-remote "https://github.com/$repo.git" HEAD | cut -f1)"
            done
          } > sources.txt
          published=$(curl -fsSL "${{ steps.pages.outputs.base_url }}/sources.txt" 2>/dev/null || true)
          build=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$published" = "$(cat sources.txt)" ]; then build=false; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "sources=$(base64 -w0 sources.txt)" >> "$GITHUB_OUTPUT"
          echo "Built from now:"; cat sources.txt; echo "Build: $build"

  build:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: rms-ds-figma-plugins
          fetch-depth: 0   # every commit and release tag: each component's changelog, its version and Figma's reads
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: rafaelmatosdasilva/rms-design-system-engine
          ref: ${{ needs.changed.outputs.engine }}
          path: engine
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check out the products beside the design system
        run: |
          for repo in $(node -p 'require("./rms-ds-figma-plugins/products.json").products.map((p) => p.repo).join(" ")'); do
            git clone --depth 1 "https://github.com/$repo.git" "${repo#*/}"
          done
      # The audit measures each component where the style guide draws it (its whole default markup, as Figma's
      # default variant), so the page is built first; without it the audit measures bare elements and reports
      # heights that are not the component's. It is built again below with the differences this audit wrote.
      - name: Build the style guide the audit measures on
        working-directory: rms-ds-figma-plugins
        run: node ../engine/audit.mjs --styleguide
      - name: Audit against Figma (writes the differences the page shows; a failing audit still publishes)
        working-directory: rms-ds-figma-plugins
        run: node ../engine/audit.mjs || true
      - name: Build the style guide, add the links, check the page against the system
        working-directory: rms-ds-figma-plugins
        # With the FIGMA_TOKEN secret set, each component's Figma image of every variant goes on the page (Figma beside
        # the code); without it the page is built the same, with no Figma images.
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          node ../engine/audit.mjs --styleguide
          node ../engine/audit.mjs --styleguide-check apps/style-guide/index.html
          mkdir -p ../site && cp apps/style-guide/index.html ../site/index.html
          cp .design-system-engine-out/differences.md ../site/differences.md 2>/dev/null || true
          echo "${{ needs.changed.outputs.sources }}" | base64 -d > ../site/sources.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
